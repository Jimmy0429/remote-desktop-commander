name: Windows USB package
on:
  pull_request:
    paths:
      - '.github/workflows/windows-usb.yml'
      - 'deploy/windows-usb/**'
      - 'scripts/build-windows-usb.mjs'
      - 'src/self-host/**'
      - 'src/version.ts'
      - 'test/packaging/windows-usb.mjs'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-usb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: USB archive / Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, arch: x64}
          - {os: windows-11-arm, arch: arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DESKTOP_COMMANDER_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.5'
          architecture: ${{ matrix.arch }}
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build test relay
        run: npm run build
      - name: Package portable agent
        run: node scripts/build-windows-usb.mjs --arch ${{ matrix.arch }} --output "$env:RUNNER_TEMP/Commander USB.zip"
      - name: Test extracted launchers with bundled Node
        run: node test/packaging/windows-usb.mjs "$env:RUNNER_TEMP/Commander USB.zip"
      - name: Record verified archive checksum
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'Commander USB.zip'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $zip).Length
          Write-Host "Verified USB archive SHA256=$hash bytes=$bytes"
