services:
  commander:
    build:
      context: ../..
      dockerfile: deploy/self-host/Dockerfile
    command:
      - serve
      - --data-dir
      - /data
      - --host
      - 0.0.0.0
      - --port
      - "8787"
      - --public-url
      - https://${COMMANDER_DOMAIN:?Set COMMANDER_DOMAIN to your hostname}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - commander_data:/data
    networks:
      - control

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      COMMANDER_DOMAIN: ${COMMANDER_DOMAIN:?Set COMMANDER_DOMAIN to your hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - commander
    networks:
      - control
      - edge

networks:
  control:
    internal: true
  edge:

volumes:
  commander_data:
  caddy_data:
  caddy_config:
